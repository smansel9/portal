<style>
/* Tampilan: bilah atas indigo tua, isi terang berwarna dingin, tabel rapat untuk daftar siswa dan nilai. */
:root {
  --bg: #f3f5fb;
  --surface: #ffffff;
  --ink: #1b2140;
  --muted: #5b6485;
  --line: #dde1ef;
  --head-bg: #232d7a;
  --head-ink: #ffffff;
  --brand: #2b3a9e;
  --brand-ink: #ffffff;
  --brand-soft: #e6e9fb;
  --ok: #17794f;
  --ok-soft: #e1f4ea;
  --warn: #8a5a00;
  --warn-soft: #fff1d6;
  --bad: #b3261e;
  --bad-soft: #fde7e5;
  --font: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1124; --surface: #171b35; --ink: #e8ebfa; --muted: #9ba4c8; --line: #2a3059;
    --head-bg: #151a45; --head-ink: #ffffff; --brand: #8e9bf5; --brand-ink: #0e1124; --brand-soft: #23294f;
    --ok: #5fd39b; --ok-soft: #12302a; --warn: #f0be5c; --warn-soft: #3a2d10;
    --bad: #ff8b82; --bad-soft: #3b1a1a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1124; --surface: #171b35; --ink: #e8ebfa; --muted: #9ba4c8; --line: #2a3059;
  --head-bg: #151a45; --head-ink: #ffffff; --brand: #8e9bf5; --brand-ink: #0e1124; --brand-soft: #23294f;
  --ok: #5fd39b; --ok-soft: #12302a; --warn: #f0be5c; --warn-soft: #3a2d10;
  --bad: #ff8b82; --bad-soft: #3b1a1a; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.5;
  padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px));
}
h1, h2, h3 { margin: 0; line-height: 1.25; text-wrap: balance; }
h2 { font-size: 1.15rem; }
h3 { font-size: 1rem; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }

.wrap { width: 100%; max-width: 1120px; margin: 0 auto; padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); }

.topbar { background: var(--head-bg); color: var(--head-ink); padding-block: 14px; }
.topbar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; flex-direction: column; min-width: 0; }
.brand strong { font-size: 1.05rem; letter-spacing: .01em; }
.brand span { font-size: .8rem; opacity: .8; }
.top-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.who { font-size: .85rem; opacity: .9; }
.btn-ghost { background: transparent; border: 1px solid rgba(255,255,255,.45); color: var(--head-ink); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
.btn-ghost:hover { background: rgba(255,255,255,.12); }

.tabs { background: var(--surface); border-bottom: 1px solid var(--line); }
.tabs .wrap { display: flex; gap: 4px; overflow-x: auto; }
.tab { background: none; border: 0; border-bottom: 3px solid transparent; padding: 12px 14px; cursor: pointer; color: var(--muted); font-weight: 600; white-space: nowrap; }
.tab[aria-current="page"] { color: var(--brand); border-bottom-color: var(--brand); }
.tab:hover { color: var(--ink); }

main { padding-block: 20px 40px; display: flex; flex-direction: column; gap: 16px; }
.stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.grid-2 { display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 820px) { .grid-2 { grid-template-columns: minmax(0, 1fr); } }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
label.field { display: flex; flex-direction: column; gap: 4px; font-size: .85rem; font-weight: 600; color: var(--muted); min-width: 0; }
input[type=text], input[type=password], input[type=number], input[type=date], select, textarea {
  background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 9px 10px; width: 100%; min-width: 0; color: var(--ink); font-weight: 400;
}
textarea { min-height: 150px; resize: vertical; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .9rem; }
.btn { background: var(--brand); color: var(--brand-ink); border: 0; border-radius: 6px; padding: 9px 16px; font-weight: 600; cursor: pointer; }
.btn:hover { filter: brightness(1.08); }
.btn[disabled] { opacity: .55; cursor: not-allowed; }
.btn-line { background: transparent; color: var(--brand); border: 1px solid var(--brand); }
.btn-danger { background: var(--bad); color: #fff; }
.btn-small { padding: 5px 10px; font-size: .85rem; }
.link-btn { background: none; border: 0; color: var(--brand); cursor: pointer; padding: 4px 6px; font-weight: 600; }
.link-btn.bad { color: var(--bad); }

.notice { border-radius: 6px; padding: 10px 14px; font-weight: 500; }
.notice.ok { background: var(--ok-soft); color: var(--ok); }
.notice.warn { background: var(--warn-soft); color: var(--warn); }
.notice.bad { background: var(--bad-soft); color: var(--bad); }
.confirm { border: 1px solid var(--bad); background: var(--bad-soft); border-radius: 6px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }

.kelas-list { display: flex; flex-direction: column; gap: 6px; }
.kelas-item { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.kelas-item[aria-current="true"] { border-color: var(--brand); background: var(--brand-soft); }
.kelas-item span.n { color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums; }

.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); background: var(--bg); }
tr:last-child td { border-bottom: 0; }
td.num, th.num { width: 48px; color: var(--muted); }
td.act { white-space: nowrap; text-align: right; }
td input { padding: 6px 8px; }

.empty { border: 1px dashed var(--line); border-radius: 8px; padding: 22px 16px; text-align: center; color: var(--muted); }
.total { font-size: .85rem; font-weight: 600; }
.total.warn { color: var(--warn); }

.dash-list { display: flex; flex-direction: column; }
.dash-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.dash-row:last-child { border-bottom: 0; }
.dash-row .meta { color: var(--muted); font-size: .85rem; }
.summary { font-size: 1.05rem; }
.summary b { font-variant-numeric: tabular-nums; }
.badge { display: inline-block; border-radius: 999px; padding: 2px 10px; font-size: .78rem; font-weight: 700; }
.badge.ok { background: var(--ok-soft); color: var(--ok); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.bad { background: var(--bad-soft); color: var(--bad); }
.attn { display: flex; flex-direction: column; }
.attn-row { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.attn-row:last-child { border-bottom: 0; }

.toolbar { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; align-items: end; }

/* Absensi */
.abs-row { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 8px 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.abs-row:last-child { border-bottom: 0; }
.abs-row .no { color: var(--muted); font-variant-numeric: tabular-nums; }
.abs-row .nama { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.abs-row .cat { grid-column: 2 / -1; }
.seg { display: inline-flex; gap: 4px; }
.seg button { width: 42px; height: 38px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 700; color: var(--muted); }
.seg button[aria-pressed="true"].st-H { background: var(--ok); border-color: var(--ok); color: #fff; }
.seg button[aria-pressed="true"].st-S { background: #b7791f; border-color: #b7791f; color: #fff; }
.seg button[aria-pressed="true"].st-I { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.seg button[aria-pressed="true"].st-A { background: var(--bad); border-color: var(--bad); color: #fff; }
@media (max-width: 560px) {
  .abs-row { grid-template-columns: 30px minmax(0, 1fr); }
  .abs-row .seg { grid-column: 2; display: grid; grid-template-columns: repeat(4, 1fr); }
  .abs-row .seg button { width: 100%; }
}
.counts { display: flex; gap: 8px; flex-wrap: wrap; }
.counts .badge { font-variant-numeric: tabular-nums; }

/* Buku nilai */
.grid-scroll { overflow: auto; max-height: 70vh; border: 1px solid var(--line); border-radius: 6px; }
.nilai-grid { border-collapse: separate; border-spacing: 0; width: max-content; min-width: 100%; }
.nilai-grid th, .nilai-grid td { padding: 6px 8px; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); background: var(--surface); }
.nilai-grid thead th { position: sticky; top: 0; z-index: 3; background: var(--bg); text-align: center; vertical-align: bottom; }
.nilai-grid .c1 { position: sticky; left: 0; z-index: 2; width: 44px; min-width: 44px; text-align: center; color: var(--muted); }
.nilai-grid .c2 { position: sticky; left: 44px; z-index: 2; min-width: 170px; max-width: 220px; text-align: left; font-weight: 600; }
.nilai-grid thead .c1, .nilai-grid thead .c2 { z-index: 4; }
.nilai-grid th .jenis { display: block; font-size: .7rem; color: var(--brand); letter-spacing: .08em; }
.nilai-grid th .nm { display: block; text-transform: none; letter-spacing: 0; font-size: .82rem; color: var(--ink); max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-inline: auto; }
.cel { display: flex; flex-direction: column; gap: 3px; align-items: center; }
.cel input { width: 66px; text-align: center; padding: 6px 4px; }
.cel input.rem { width: 66px; font-size: .78rem; padding: 3px 4px; border-style: dashed; }
.cel input.salah { border-color: var(--bad); background: var(--bad-soft); }
.cel input.ubah { border-color: var(--brand); box-shadow: inset 0 0 0 1px var(--brand); }
.nilai-grid td.akhir { text-align: center; font-weight: 700; min-width: 70px; }
.nilai-grid td.akhir.rendah { color: var(--bad); }
.nilai-grid td.status { text-align: center; min-width: 90px; }
.savebar { position: sticky; bottom: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; box-shadow: 0 -4px 14px rgba(0,0,0,.08); z-index: 5; }

.entry { border: 1px solid var(--line); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.entry h3 { overflow-wrap: anywhere; }
.entry .kv { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 2px 12px; font-size: .92rem; }
.entry .kv dt { color: var(--muted); } .entry .kv dd { margin: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
@media (max-width: 560px) { .entry .kv { grid-template-columns: minmax(0, 1fr); } .entry .kv dt { margin-top: 6px; } }
textarea.ringan { min-height: 80px; font-family: var(--font); font-size: .95rem; }
.rekap td, .rekap th { white-space: nowrap; }
.rekap td.nama { white-space: normal; min-width: 160px; font-weight: 600; }
.rekap td.n, .rekap th.n { text-align: center; }
.login-page { min-height: 100vh; display: grid; place-items: center; padding: 24px max(16px, env(safe-area-inset-left, 0px)); }
.login-card { width: 100%; max-width: 400px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
.login-card .school { color: var(--muted); font-size: .9rem; }
.kode { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 1.1rem; letter-spacing: .04em; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; }
.btn.berkas { max-width: 100%; text-align: left; overflow-wrap: anywhere; font-weight: 500; }
.loading { padding: 40px 16px; text-align: center; color: var(--muted); }
@media (prefers-reduced-motion: no-preference) { .notice { animation: masuk .18s ease-out; } @keyframes masuk { from { opacity: 0; transform: translateY(-3px); } } }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
.stat { align-items: flex-start; gap: 6px; }
.stat .big { font-size: 2.4rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.rendah { color: var(--bad); }
td.n, th.n { text-align: center; }
.isi { white-space: pre-wrap; overflow-wrap: anywhere; }

.pilihan { margin: 0; padding-left: 20px; font-size: .9rem; overflow-wrap: anywhere; }

/* ===== Portal masuk (guru dan siswa) ===== */
.portal { min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); }
.hero { position: relative; overflow: hidden; color: #fff; padding: clamp(28px, 5vw, 56px); display: flex; flex-direction: column; justify-content: space-between; gap: 28px;
  background: radial-gradient(1200px 600px at 10% -10%, #3b4bd0 0%, transparent 60%), radial-gradient(800px 500px at 110% 110%, #17794f55 0%, transparent 60%), linear-gradient(155deg, #161d5c 0%, #232d7a 55%, #1a2268 100%); }
.hero::before { content: ""; position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,.09) 1px, transparent 1px); background-size: 22px 22px; mask-image: linear-gradient(180deg, #000 0%, transparent 85%); pointer-events: none; }
.hero > * { position: relative; }
.hero-brand { display: flex; align-items: center; gap: 12px; }
.hero-brand img { width: 76px; height: 76px; object-fit: contain; flex: none; filter: drop-shadow(0 3px 8px rgba(0,0,0,.35)); }
.brand-row { display: flex; align-items: center; gap: 12px; min-width: 0; }
.logo-atas { width: 42px; height: 42px; object-fit: contain; flex: none; filter: drop-shadow(0 2px 4px rgba(0,0,0,.3)); }
.hero-brand strong { display: block; font-size: 1.05rem; letter-spacing: .01em; }
.hero-brand span { display: block; font-size: .82rem; opacity: .8; }
.hero h2.judul { font-size: clamp(1.7rem, 3.2vw, 2.6rem); line-height: 1.15; font-weight: 700; max-width: 18ch; text-wrap: balance; }
.hero h2.judul em { font-style: normal; color: #ffd166; }
.hero p.sub { margin-top: 12px; max-width: 46ch; opacity: .85; font-size: 1rem; }
.hero-cards { position: relative; height: 310px; max-width: 520px; }
.hc { position: absolute; background: rgba(255,255,255,.96); color: #1b2140; border-radius: 14px; padding: 14px 16px; box-shadow: 0 18px 40px rgba(6,10,50,.35); font-size: .82rem; }
.hc h4 { margin: 0 0 8px; font-size: .78rem; text-transform: uppercase; letter-spacing: .07em; color: #5b6485; display: flex; justify-content: space-between; gap: 12px; }
.hc h4 b { color: #17794f; letter-spacing: 0; text-transform: none; }
.hc-abs { left: 0; top: 0; width: 236px; }
.dots { display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; }
.dots i { aspect-ratio: 1; border-radius: 50%; background: #17794f; display: block; }
.dots i.s { background: #e0a21b; } .dots i.i { background: #3b82f6; } .dots i.a { background: #d64545; }
.hc-nilai { left: 262px; top: 62px; width: 220px; }
.bars { display: flex; align-items: flex-end; gap: 7px; height: 70px; position: relative; padding-bottom: 1px; border-bottom: 1px solid #dde1ef; }
.bars i { flex: 1; border-radius: 4px 4px 0 0; background: linear-gradient(180deg, #4d5fe0, #2b3a9e); display: block; }
.bars::after { content: "KKM"; position: absolute; left: 0; right: 0; bottom: 44px; border-top: 1px dashed #d64545; font-size: .62rem; color: #d64545; text-align: right; line-height: 1; padding-top: 2px; }
.hc-jurnal { left: 44px; top: 196px; width: 270px; }
.hc-jurnal .baris { display: flex; gap: 8px; align-items: center; margin-top: 6px; }
.hc-jurnal .tgl { background: #e6e9fb; color: #2b3a9e; border-radius: 6px; padding: 1px 7px; font-weight: 700; font-size: .72rem; flex: none; }
.hc-jurnal .gar { height: 7px; border-radius: 4px; background: #dde1ef; flex: 1; }
.hero-foot { display: flex; flex-wrap: wrap; gap: 8px 22px; font-size: .88rem; opacity: .9; }
.hero-foot span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #ffd166; margin-right: 8px; }
@media (prefers-reduced-motion: no-preference) {
  .hc { animation: melayang 7s ease-in-out infinite; }
  .hc-nilai { animation-delay: -2.3s; } .hc-jurnal { animation-delay: -4.6s; }
  @keyframes melayang { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
}
.panel-masuk { display: grid; place-items: center; padding: 28px max(18px, env(safe-area-inset-left, 0px)); background: var(--bg); }
.form-masuk { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 16px; }
.form-masuk h1 { font-size: 1.7rem; }
.form-masuk .lead { color: var(--muted); }
.form-masuk .btn { padding: 12px 16px; font-size: 1rem; }
.form-masuk .cek { display: flex; align-items: center; gap: 8px; font-size: .88rem; color: var(--muted); }
.form-masuk .cek input { width: auto; }
.form-masuk .bantuan { font-size: .85rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: 14px; }
@media (max-width: 860px) {
  .portal { grid-template-columns: minmax(0, 1fr); }
  .hero { padding: 22px 18px 24px; gap: 14px; }
  .hero-cards, .hero-foot { display: none; }
  .hero h2.judul { font-size: 1.45rem; max-width: none; }
  .hero p.sub { margin-top: 6px; font-size: .92rem; }
  .panel-masuk { align-items: start; padding-top: 22px; }
}
</style>
</head>

/* Membaca daftar siswa yang ditempel. Format yang dikenali, satu siswa per baris:
   "Nama"  |  "12345 Nama"  |  "12345;Nama"  |  "12345<TAB>Nama" (salinan dari Excel)  |  "1. Nama" */
function parseDaftar(teks) {
  const hasil = [];
  for (let baris of String(teks).split(/\r?\n/)) {
    baris = baris.trim();
    if (!baris) continue;
    let nis = null, nama = baris;
    const bagian = baris.split(/\t|;/).map(s => s.trim()).filter(Boolean);
    if (bagian.length >= 2) {
      const i = bagian.findIndex(p => /^\d{4,}$/.test(p));
      if (i >= 0) { nis = bagian[i]; nama = bagian.filter((_, j) => j !== i).join(" "); }
      else nama = bagian.join(" ");
    } else {
      const m = baris.match(/^(\d{4,})[\s.\-)]+(.+)$/);
      if (m) { nis = m[1]; nama = m[2]; }
      else nama = baris.replace(/^\d{1,3}[.)]?\s+/, "");
    }
    nama = nama.replace(/\s+/g, " ").trim();
    if (nama) hasil.push({ nis, nama });
  }
  return hasil;
}

function bacaPengaturan(fd) {
  const num = (k) => Number(String(fd.get(k)).replace(",", "."));
  const o = {
    kkm: num("kkm"), bobot_tugas: num("bobot_tugas"), bobot_uh: num("bobot_uh"),
    bobot_pts: num("bobot_pts"), bobot_pas: num("bobot_pas"),
  };
  if (!(o.kkm >= 0 && o.kkm <= 100)) throw new Error("KKM harus antara 0 dan 100.");
  for (const k of ["bobot_tugas", "bobot_uh", "bobot_pts", "bobot_pas"])
    if (!(o[k] >= 0)) throw new Error("Bobot tidak boleh kosong atau negatif.");
  if (o.bobot_tugas + o.bobot_uh + o.bobot_pts + o.bobot_pas <= 0) throw new Error("Jumlah bobot harus lebih dari 0.");
  return o;
}

async function ambilSemua(buat) {          // membaca semua baris, 1000 per putaran
  const hasil = [];
  for (let dari = 0; ; dari += 1000) {
    const { data, error } = await buat().range(dari, dari + 999);
    if (error) throw error;
    hasil.push(...(data || []));
    if (!data || data.length < 1000) break;
  }
  return hasil;
}

async function muatData() {
  const [k, s] = await Promise.all([
    ambilSemua(() => state.sb.from("kelas").select("*")),
    ambilSemua(() => state.sb.from("siswa").select("id, kelas_id, nis, nama, user_id, username")),
  ]);
  state.kelas = k.sort((a, b) => urut(a.nama, b.nama));
  state.siswa = s.sort((a, b) => urut(a.nama, b.nama));
  if (state.kelasId && !state.kelas.some(x => x.id === state.kelasId)) state.kelasId = null;
  await muatDash();
}

async function muatDash() {                // ringkasan dashboard; kegagalannya tidak boleh menghentikan aplikasi
  try {
    const [rn, ra, ah, tg] = await Promise.all([
      ambilSemua(() => state.sb.from("rekap_nilai").select("siswa_id, kelas_id, nama, nilai_akhir")),
      ambilSemua(() => state.sb.from("rekap_absensi").select("siswa_id, kelas_id, nama, total_tercatat, persen_hadir")),
      ambilSemua(() => state.sb.from("absensi").select("kelas_id").eq("tanggal", hariIni())),
      ambilSemua(() => state.sb.from("pengumuman").select("id, kelas_id, jenis, judul, tenggat").gte("tenggat", hariIni())),
    ]);
    state.dash = { rekapNilai: rn, rekapAbsensi: ra, absenHariIni: [...new Set(ah.map(r => r.kelas_id))], tenggat: tg, galat: false };
  } catch (_) {
    state.dash = { rekapNilai: [], rekapAbsensi: [], absenHariIni: [], tenggat: [], galat: true };
  }
}

async function setelahLogin(user) {
  const { data, error } = await state.sb.from("profil").select("nama, peran").eq("id", user.id).single();
  if (error || !data) {
    await state.sb.auth.signOut();
    throw new Error("Profil akun tidak ditemukan. Hubungi pengelola aplikasi.");
  }
  if (data.peran !== "guru") {
    await state.sb.auth.signOut();
    throw new Error("Akun ini bukan akun guru. Halaman ini hanya untuk guru.");
  }
  state.user = user; state.profil = data;
  await muatData();
}

async function aksiLogin(e) {
  e.preventDefault();
  const fd = new FormData(e.target);
  const nama = String(fd.get("username") || "").trim();
  const sandi = String(fd.get("password") || "");
  if (!nama || !sandi) { state.loginError = "Isi username dan password."; return render(); }
  const email = nama.includes("@") ? nama : nama.toLowerCase() + "@" + DOMAIN_EMAIL;
  state.busy = true; state.loginError = ""; render();
  try {
    const { data, error } = await state.sb.auth.signInWithPassword({ email, password: sandi });
    if (error) throw error;
    await setelahLogin(data.user);
  } catch (err) {
    state.loginError = pesanError(err);
  }
  state.busy = false; render();
}

async function aksiKeluar() {
  if (jumlahUbah() > 0 && !state.konfirmKeluar) {
    state.konfirmKeluar = true;
    beriTahu("warn", "Ada nilai yang belum disimpan. Klik Keluar sekali lagi untuk membuangnya.");
    return render();
  }
  state.konfirmKeluar = false;
  await state.sb.auth.signOut();
  Object.assign(state, { user: null, profil: null, kelas: [], siswa: [], kelasId: null, tab: "dashboard", notice: null, loginError: "", draft: {}, penilaian: [], nilaiMap: {}, nilaiKelasId: null,
    info: { kelasId: null, daftar: [], hapus: null, draft: null, berkas: [], kumpul: [], buka: null, galatTugas: "" } });
  window.Portal.tampilkanLogin();
}

function kelasAktif() { return state.kelas.find(k => k.id === state.kelasId) || null; }
function siswaKelas(id) { return state.siswa.filter(s => s.kelas_id === id); }
function kelasById(id) { return state.kelas.find(k => k.id === id) || null; }

/* ===================== AKSI KELAS & SISWA ===================== */
function aksiTambahKelas(e) {
  e.preventDefault();
  const fd = new FormData(e.target);
  state.draftKelas = Object.fromEntries(fd.entries());
  jalankan(async () => {
    const nama = String(fd.get("nama") || "").trim();
    if (!nama) throw new Error("Nama kelas wajib diisi, misalnya X-1.");
    if (state.kelas.some(k => k.nama.toLowerCase() === nama.toLowerCase() && k.tahun_ajaran === String(fd.get("tahun_ajaran")).trim() && k.semester === fd.get("semester")))
      throw new Error("Kelas " + nama + " untuk tahun ajaran dan semester ini sudah ada.");
    const baris = Object.assign({
      nama, mapel: String(fd.get("mapel") || "").trim() || "Informatika",
      tahun_ajaran: String(fd.get("tahun_ajaran") || "").trim(), semester: String(fd.get("semester")),
    }, bacaPengaturan(fd));
    if (!baris.tahun_ajaran) throw new Error("Tahun ajaran wajib diisi, misalnya 2026/2027.");
    const { data, error } = await state.sb.from("kelas").insert(baris).select().single();
    if (error) throw error;
    await muatData();
    state.kelasId = data.id; state.formKelas = false; state.daftarTeks = ""; state.draftKelas = null;
    return nama;
  }, (n) => "Kelas " + n + " dibuat. Sekarang tambahkan siswanya.");
}

function aksiSimpanPengaturan(e) {
  e.preventDefault();
  const id = state.kelasId, fd = new FormData(e.target);
  jalankan(async () => {
    const { error } = await state.sb.from("kelas").update(bacaPengaturan(fd)).eq("id", id);
    if (error) throw error;
    await muatData();
  }, "Pengaturan kelas disimpan.");
}

function aksiHapusKelas() {
  const id = state.kelasId;
  jalankan(async () => {
    const { error } = await state.sb.from("kelas").delete().eq("id", id);
    if (error) throw error;
    state.kelasId = null; state.hapusKelas = false;
    if (state.nilaiKelasId === id) { state.nilaiKelasId = null; state.penilaian = []; state.nilaiMap = {}; state.draft = {}; }
    if (state.absen.kelasId === id) state.absen.kelasId = null;
    await muatData();
  }, "Kelas dihapus.");
}

function aksiTambahDaftar() {
  const id = state.kelasId;
  const baru = parseDaftar(state.daftarTeks);
  jalankan(async () => {
    if (!baru.length) throw new Error("Belum ada nama yang terbaca. Tempel daftar nama, satu siswa per baris.");
    const ada = new Set(siswaKelas(id).map(s => s.nama.toLowerCase()));
    const unik = [], lewati = [];
    for (const r of baru) {
      const k = r.nama.toLowerCase();
      if (ada.has(k)) lewati.push(r.nama); else { ada.add(k); unik.push(r); }
    }
    if (unik.length) {
      const { error } = await state.sb.from("siswa").insert(unik.map(r => ({ kelas_id: id, nis: r.nis, nama: r.nama })));
      if (error) throw error;
    }
    state.daftarTeks = "";
    await muatData();
    return { tambah: unik.length, lewati: lewati.length };
  }, (r) => r.tambah + " siswa ditambahkan." + (r.lewati ? " " + r.lewati + " nama dilewati karena sudah ada." : ""));
}

function aksiSimpanSiswa(id, nis, nama) {
  jalankan(async () => {
    nama = nama.trim();
    if (!nama) throw new Error("Nama siswa tidak boleh kosong.");
    const { error } = await state.sb.from("siswa").update({ nis: nis.trim() || null, nama }).eq("id", id);
    if (error) throw error;
    state.editSiswa = null;
    await muatData();

}

function aksiHapusSiswa(id) {
  jalankan(async () => {
    const { error } = await state.sb.from("siswa").delete().eq("id", id);
    if (error) throw error;
    state.hapusSiswa = null;
    await muatData();

}

/* ===================== ABSENSI ===================== */
async function muatAbsensi() {
  const a = state.absen;
  a.status = {}; a.catatan = {}; a.tersimpan = false;
  if (!a.kelasId) return;
  const data = await ambilSemua(() => state.sb.from("absensi").select("siswa_id, status, catatan")
    .eq("kelas_id", a.kelasId).eq("tanggal", a.tanggal).eq("jam_ke", a.jam));
  for (const r of data) { a.status[r.siswa_id] = r.status; a.catatan[r.siswa_id] = r.catatan || ""; }
  a.tersimpan = data.length > 0;
}
function aksiPilihAbsen() { jalankan(muatAbsensi); }
function setStatus(sid, st) {
  const a = state.absen;
  a.status[sid] = a.status[sid] === st ? null : st;
  a.tersimpan = false; render();
}
function semuaHadir() {
  const a = state.absen;
  for (const s of siswaKelas(a.kelasId)) if (!a.status[s.id]) a.status[s.id] = "H";
  a.tersimpan = false; render();
}
function aksiSimpanAbsen() {
  const a = state.absen, daftar = siswaKelas(a.kelasId);
  jalankan(async () => {
    const belum = daftar.filter(s => !a.status[s.id]);
    if (belum.length) throw new Error(belum.length + " siswa belum ditandai. Tandai semua siswa, atau klik Semua Hadir lalu ubah yang tidak hadir.");
    const baris = daftar.map(s => ({
      kelas_id: a.kelasId, siswa_id: s.id, tanggal: a.tanggal, jam_ke: a.jam, status: a.status[s.id],
      catatan: a.status[s.id] === "H" ? null : ((a.catatan[s.id] || "").trim() || null),
    }));
    const { error } = await state.sb.from("absensi").upsert(baris, { onConflict: "siswa_id,tanggal,jam_ke" });
    if (error) throw error;
    a.tersimpan = true;
    await muatDash();
    return baris.length;
  }, (n) => "Absensi " + n + " siswa tersimpan.");
}

/* ===================== BUKU NILAI ===================== */
async function muatNilai() {
  const id = state.nilaiKelasId;
  state.penilaian = []; state.nilaiMap = {}; state.draft = {};
  if (!id) return;
  const p = await ambilSemua(() => state.sb.from("penilaian").select("*").eq("kelas_id", id));
  p.sort((a, b) => (URUT_JENIS.indexOf(a.jenis) - URUT_JENIS.indexOf(b.jenis)) || String(a.tanggal || "").localeCompare(String(b.tanggal || "")) || String(a.dibuat_pada || "").localeCompare(String(b.dibuat_pada || "")) || urut(a.nama, b.nama));
  state.penilaian = p;
  if (p.length) {
    const ids = p.map(x => x.id);
    const n = await ambilSemua(() => state.sb.from("nilai").select("penilaian_id, siswa_id, nilai, remedial").in("penilaian_id", ids));
    for (const r of n) state.nilaiMap[r.penilaian_id + "|" + r.siswa_id] = { nilai: r.nilai, remedial: r.remedial };
  }
}
function aksiPilihKelasNilai(id) { state.nilaiKelasId = id; jalankan(muatNilai); }

function jumlahUbah() { return Object.keys(state.draft).length; }
function nilaiSel(sid, pid) {
  const key = pid + "|" + sid, d = state.draft[key];
  if (d) return d;
  const o = state.nilaiMap[key];
  return { nilai: o && o.nilai != null ? String(Number(o.nilai)) : "", remedial: o && o.remedial != null ? String(Number(o.remedial)) : "" };
}
function nilaiEfektif(sid, p) {
  const s = nilaiSel(sid, p.id), n = angka(s.nilai), r = angka(s.remedial);
  if (n == null || Number.isNaN(n)) return null;
  return (r != null && !Number.isNaN(r)) ? Math.max(n, r) : n;
}
/* Sama dengan rumus di database: rata-rata per jenis, lalu rata-rata bertimbang. */
function hitungAkhir(sid, k) {
  const bobot = { tugas: Number(k.bobot_tugas), uh: Number(k.bobot_uh), pts: Number(k.bobot_pts), pas: Number(k.bobot_pas) };
  let atas = 0, bawah = 0;
  for (const j of URUT_JENIS) {
    const v = state.penilaian.filter(p => p.jenis === j).map(p => nilaiEfektif(sid, p)).filter(x => x != null);
    if (!v.length) continue;
    atas += (v.reduce((a, b) => a + b, 0) / v.length) * bobot[j]; bawah += bobot[j];
  }
  return bawah > 0 ? Math.round((atas / bawah) * 100) / 100 : null;
}

function ubahNilai(sid, pid, bagian, nilai) {
  const key = pid + "|" + sid, o = state.nilaiMap[key] || {};
  const asal = { nilai: o.nilai != null ? String(Number(o.nilai)) : "", remedial: o.remedial != null ? String(Number(o.remedial)) : "" };
  const cur = Object.assign({}, nilaiSel(sid, pid)); cur[bagian] = nilai;
  if (cur.nilai === asal.nilai && cur.remedial === asal.remedial) delete state.draft[key]; else state.draft[key] = cur;
  state.konfirmKeluar = false;
}
function segarkanBaris(sid) {
  const k = kelasById(state.nilaiKelasId), tr = document.querySelector('tr[data-sid="' + sid + '"]');
  if (!k || !tr) return;
  const akhir = hitungAkhir(sid, k), kkm = Number(k.kkm);
  const tdA = tr.querySelector("td.akhir"), tdS = tr.querySelector("td.status");
  tdA.textContent = rapi(akhir); tdA.classList.toggle("rendah", akhir != null && akhir < kkm);
  tdS.replaceChildren(...statusKetuntasan(akhir, kkm));
  for (const p of state.penilaian) {
    const rem = tr.querySelector('input.rem[data-pid="' + p.id + '"]'), inp = tr.querySelector('input.nilai[data-pid="' + p.id + '"]');
    if (!rem || !inp) continue;
    const s = nilaiSel(sid, p.id), n = angka(s.nilai);
    rem.hidden = !((n != null && !Number.isNaN(n) && n < kkm) || s.remedial !== "");
    const key = p.id + "|" + sid;
    inp.classList.toggle("ubah", key in state.draft);
  }
  segarkanBilahSimpan();
}
function statusKetuntasan(akhir, kkm) {
  if (akhir == null) return [h("span", { class: "muted" }, "-")];
  return [akhir >= kkm ? h("span", { class: "badge ok" }, "Tuntas") : h("span", { class: "badge bad" }, "Belum tuntas")];
}
function adaNilaiSalah() {
  return Object.values(state.draft).some(d => [d.nilai, d.remedial].some(v => { const n = angka(v); return n != null && (Number.isNaN(n) || n < 0 || n > 100); }));
}
function segarkanBilahSimpan() {
  const el = document.getElementById("infoUbah"), btn = document.getElementById("btnSimpanNilai"), buang = document.getElementById("btnBuang");
  if (!el) return;
  const n = jumlahUbah();
  el.textContent = n ? n + " nilai belum disimpan" : "Semua nilai sudah tersimpan";
  if (btn) btn.disabled = n === 0 || state.busy;
  if (buang) buang.hidden = n === 0;
}
function aksiSimpanNilai() {
  jalankan(async () => {
    if (adaNilaiSalah()) throw new Error("Ada nilai yang tidak valid (berwarna merah). Nilai harus berupa angka 0 sampai 100.");
    const baris = Object.entries(state.draft).map(([key, d]) => {
      const [pid, sid] = key.split("|");
      return { penilaian_id: pid, siswa_id: sid, nilai: angka(d.nilai), remedial: angka(d.remedial) };
    });
    for (let i = 0; i < baris.length; i += 200) {
      const { error } = await state.sb.from("nilai").upsert(baris.slice(i, i + 200), { onConflict: "penilaian_id,siswa_id" });
      if (error) throw error;
    }
    await muatNilai(); await muatDash();
    return baris.length;
  }, (n) => n + " nilai tersimpan.");
}
function aksiBuangNilai() { state.draft = {}; state.konfirmKeluar = false; render(); }

function aksiTambahPenilaian(e) {
  e.preventDefault();
  const fd = new FormData(e.target), id = state.nilaiKelasId;
  jalankan(async () => {
    const jenis = String(fd.get("jenis"));
    let nama = String(fd.get("nama") || "").trim();
    if (!nama) nama = JENIS[jenis] + " " + (state.penilaian.filter(p => p.jenis === jenis).length + 1);
    if (state.penilaian.some(p => p.nama.toLowerCase() === nama.toLowerCase())) throw new Error("Penilaian bernama " + nama + " sudah ada di kelas ini.");
    const { error } = await state.sb.from("penilaian").insert({ kelas_id: id, nama, jenis, bobot: 1, tanggal: String(fd.get("tanggal") || "") || null });
    if (error) throw error;
    const simpan = state.draft; await muatNilai(); state.draft = simpan;
    return nama;
  }, (n) => "Penilaian " + n + " ditambahkan.");
}
function aksiUbahNamaPenilaian(id, nama) {
  jalankan(async () => {
    nama = nama.trim();
    if (!nama) throw new Error("Nama penilaian tidak boleh kosong.");
    const { error } = await state.sb.from("penilaian").update({ nama }).eq("id", id);
    if (error) throw error;
    state.editPenilaian = null;
    const simpan = state.draft; await muatNilai(); state.draft = simpan;
  }, "Nama penilaian diperbarui.");
}
function aksiHapusPenilaian(id) {
  jalankan(async () => {
    const { error } = await state.sb.from("penilaian").delete().eq("id", id);
    if (error) throw error;
    state.hapusPenilaian = null;
    await muatNilai(); await muatDash();
  }, "Penilaian dihapus.");
}

/* ===================== NAVIGASI ===================== */
function bukaTab(id) {
  if (jumlahUbah() > 0 && id !== "nilai") {
    return (beriTahu("warn", "Ada nilai yang belum disimpan. Buka Buku Nilai untuk menyimpan atau membuangnya."), render());
  }
  state.tab = id; state.notice = null;
  const pertama = state.kelas[0] ? state.kelas[0].id : null;
  if (id === "absensi") {
    if (!kelasById(state.absen.kelasId)) state.absen.kelasId = state.kelasId && kelasById(state.kelasId) ? state.kelasId : pertama;
    return jalankan(muatAbsensi);
  }
  const kelasPilihan = (id0) => (kelasById(id0) ? id0 : (state.kelasId && kelasById(state.kelasId) ? state.kelasId : pertama));
  if (id === "jurnal") { state.jurnal.kelasId = kelasPilihan(state.jurnal.kelasId); state.jurnal.edit = null; state.jurnal.hapus = null; return jalankan(muatJurnal); }
  if (id === "rekap") { state.rekap.kelasId = kelasPilihan(state.rekap.kelasId); return jalankan(muatRekap); }
  if (id === "info") { state.info.kelasId = kelasPilihan(state.info.kelasId); state.info.hapus = null; return jalankan(muatInfo); }
  if (id === "nilai") {
    if (!kelasById(state.nilaiKelasId)) {
      state.nilaiKelasId = state.kelasId && kelasById(state.kelasId) ? state.kelasId : pertama;
      return jalankan(muatNilai);
    }
  }
  render();
}

/* ===================== TAMPILAN ===================== */
function render() {
  const y = window.scrollY;
  const app = document.getElementById("app");
  app.replaceChildren(...(
    state.booting ? [h("p", { class: "loading" }, "Memuat aplikasi...")]
    : !state.sb ? [tampilanGagalMuat()]
    : !state.user ? [tampilanLogin()]
    : [tampilanBilahAtas(), tampilanTab(), h("div", { class: "wrap" }, h("main", {}, tampilanNotice(), tampilanIsi()))]
  ));
  window.scrollTo(0, y);
}

/* ===================== AKUN SISWA ===================== */
const PASSWORD_AWAL = "User123!";            // password awal semua siswa (ditentukan guru)
const tidur = (ms) => new Promise(r => setTimeout(r, ms));
const batasLaju = (err) => !!err && (err.status === 429 || /rate limit|too many/i.test(String(err.message || "")));
const tanpaAksen = (s) => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "");

function usernameDariNis(nis) { return tanpaAksen(nis).toLowerCase().replace(/[^a-z0-9._-]/g, ""); }
function usernameDariNama(s) {
  const k = kelasById(s.kelas_id);
  const depan = tanpaAksen(s.nama).toLowerCase().trim().split(/\s+/)[0].replace(/[^a-z0-9]/g, "") || "siswa";
  const kls = tanpaAksen(k ? k.nama : "").toLowerCase().replace(/[^a-z0-9]/g, "");
  return kls ? depan + "." + kls : depan;
}
function rencanaAkun(daftar) {               // pasangan siswa + username yang akan dibuat (tanpa kembar)
  const dipakai = new Set(state.siswa.filter(s => s.username).map(s => s.username));
  return daftar.map(s => {
    const dasar = usernameDariNis(s.nis) || usernameDariNama(s);
    let u = dasar, n = 1;
    while (dipakai.has(u)) { n++; u = dasar + "_" + n; }
    dipakai.add(u);
    return { siswa: s, username: u };
  });
}
function daftarTargetAkun() {
  const a = state.akun;
  const dasar = a.kelasId !== "semua" && kelasById(a.kelasId) ? siswaKelas(a.kelasId) : state.siswa;
  const namaKelas = (s) => (kelasById(s.kelas_id) || {}).nama || "";
  return [...dasar].sort((x, y) => urut(namaKelas(x), namaKelas(y)) || urut(x.nama, y.nama));
}

async function tungguBatas(detik) {
  for (let i = detik; i > 0 && !state.akun.henti; i--) {
    state.akun.pesan = "Batas pembuatan akun dari Supabase tercapai. Menunggu " + i + " detik, lalu lanjut otomatis.";
    render(); await tidur(1000);
  }
  state.akun.pesan = "";
}

async function buatSatuAkun(sb2, item) {
  const email = item.username + "@" + DOMAIN_EMAIL;
  let id = null;
  for (let coba = 0; coba < 8 && !id; coba++) {
    if (state.akun.henti) return "henti";
    const { data, error } = await sb2.auth.signUp({ email, password: PASSWORD_AWAL });
    if (batasLaju(error)) { await tungguBatas(65); continue; }
    const sudahAda = (error && /already (been )?registered/i.test(error.message)) || (!error && data.user && data.user.identities && data.user.identities.length === 0);
    if (sudahAda) {                            // akun sudah ada (mis. proses sebelumnya terputus): coba hubungkan
      const r = await sb2.auth.signInWithPassword({ email, password: PASSWORD_AWAL });
      if (batasLaju(r.error)) { await tungguBatas(65); continue; }
      if (r.error || !r.data.user) throw new Error("Username " + item.username + " sudah dipakai akun lain.");
      id = r.data.user.id; continue;
    }
    if (error) throw error;
    if (!data.user) throw new Error("Akun tidak terbentuk.");
    id = data.user.id;
  }
  if (!id) throw new Error("Gagal setelah beberapa kali mencoba.");
  const { error: e2 } = await state.sb.from("siswa").update({ user_id: id, username: item.username }).eq("id", item.siswa.id);
  if (e2) throw e2;
  item.siswa.user_id = id; item.siswa.username = item.username;
}

async function aksiBuatAkun() {
  const a = state.akun;
  if (a.berjalan) return;
  const target = rencanaAkun(daftarTargetAkun().filter(s => !s.user_id));
  if (!target.length) return;
  a.berjalan = true; a.henti = false; a.total = target.length; a.selesai = 0; a.gagal = []; a.pesan = ""; state.notice = null; render();
  let sb2 = null;
  try {
    sb2 = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false, storageKey: "sb-pendaftar" } });
  } catch (err) { a.berjalan = false; beriTahu("bad", pesanError(err)); return render(); }
  for (const item of target) {
    if (a.henti) break;
    try {
      if ((await buatSatuAkun(sb2, item)) === "henti") break;
      a.selesai++;
    } catch (err) { a.gagal.push(item.siswa.nama + " (" + item.username + "): " + pesanError(err)); }
    render();
  }
  a.berjalan = false; a.pesan = "";
  const sisa = a.total - a.selesai - a.gagal.length;
  beriTahu(a.gagal.length || sisa ? "warn" : "ok",
    a.selesai + " akun berhasil dibuat" + (a.gagal.length ? ", " + a.gagal.length + " gagal" : "") + (sisa ? ", " + sisa + " belum diproses (dihentikan)" : "") + ".");
  render();
}

/* ===================== BERKAS TUGAS (lampiran guru dan pengumpulan siswa) ===================== */
const BUCKET = "tugas";
const MAKS_BERKAS = 5, MAKS_UKURAN = 10 * 1024 * 1024;
const EKSTENSI_OK = ["jpg", "jpeg", "png", "webp", "gif", "heic", "heif", "pdf", "doc", "docx", "ppt", "pptx", "xls", "xlsx", "txt", "zip"];
const ACCEPT_BERKAS = "image/*,.pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.txt,.zip";
const tanpaAksenB = (s) => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "");
function ukuranTeks(b) { b = Number(b) || 0; return b < 1024 ? b + " B" : b < 1048576 ? Math.round(b / 1024) + " KB" : (b / 1048576).toFixed(1).replace(".", ",") + " MB"; }
function namaAman(n) { return tanpaAksenB(n).replace(/[^A-Za-z0-9._-]+/g, "_").replace(/^_+|_+$/g, "").slice(-80) || "berkas"; }
function ekstensiBerkas(n) { const m = /\.([A-Za-z0-9]+)$/.exec(n || ""); return m ? m[1].toLowerCase() : ""; }
function tanggalLokal(ts) { const d = new Date(ts); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function waktuTeks(ts) { return new Date(ts).toLocaleString("id-ID", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }); }

async function kecilkanGambar(file) {            // foto dikecilkan agar hemat penyimpanan (maks. 1600 px, JPEG)
  try {
    const bmp = await createImageBitmap(file, { imageOrientation: "from-image" });
    const skala = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    if (skala === 1 && file.size < 600 * 1024) { if (bmp.close) bmp.close(); return file; }
    const c = document.createElement("canvas");
    c.width = Math.max(1, Math.round(bmp.width * skala)); c.height = Math.max(1, Math.round(bmp.height * skala));
    const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(bmp, 0, 0, c.width, c.height);
    if (bmp.close) bmp.close();
    const blob = await new Promise(r => c.toBlob(r, "image/jpeg", 0.8));
    if (!blob || blob.size >= file.size) return file;
    return new File([blob], file.name.replace(/\.[^.]+$/, "") + ".jpg", { type: "image/jpeg" });
  } catch (_) { return file; }
}
async function siapkanBerkas(file) {
  if (!EKSTENSI_OK.includes(ekstensiBerkas(file.name))) throw new Error("Jenis berkas \"" + file.name + "\" tidak diizinkan. Boleh: foto, PDF, Word, PowerPoint, Excel, TXT, ZIP.");
  const hasil = /^image\/(jpeg|png|webp)$/.test(file.type) ? await kecilkanGambar(file) : file;
  if (hasil.size > MAKS_UKURAN) throw new Error("Berkas \"" + file.name + "\" terlalu besar (" + ukuranTeks(hasil.size) + "). Maksimal 10 MB.");
  return hasil;
}
async function unggahBerkas(sb, path, file) {
  const { error } = await sb.storage.from(BUCKET).upload(path, file, { contentType: file.type || "application/octet-stream", upsert: false });
  if (error) throw error;
}
async function unduhBerkas(sb, b) {
  const { data, error } = await sb.storage.from(BUCKET).download(b.path);
  if (error) throw error;
  const url = URL.createObjectURL(data);
  const a = document.createElement("a"); a.href = url; a.download = b.nama_asli; document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}

/* ===================== JURNAL MENGAJAR ===================== */
function tanggalPanjang(t) {
  return new Date(t + "T00:00:00").toLocaleDateString("id-ID", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
}
function ringkasDariBaris(rows) {            // bila ada beberapa jam pelajaran, dipakai jam yang paling awal
  if (!rows.length) return null;
  const per = {};
  for (const r of rows) { const j = Number(r.jam_ke); per[j] = per[j] || { H: 0, S: 0, I: 0, A: 0 }; per[j][r.status]++; }
  const jam = Math.min(...Object.keys(per).map(Number));
  return Object.assign({ jam }, per[jam]);
}
function teksHadir(r) {
  return r ? "Kehadiran dari absensi (jam ke-" + r.jam + "): Hadir " + r.H + ", Sakit " + r.S + ", Izin " + r.I + ", Alpa " + r.A
           : "Absensi tanggal ini belum diisi. Isi dulu di tab Absensi agar kehadiran tercatat bersama jurnal.";
}
async function muatJurnal() {
  const j = state.jurnal;
  j.daftar = []; j.ringkas = {};

    if (skala === 1 && file.size < 600 * 1024) { if (bmp.close) bmp.close(); return file; }

    const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(bmp, 0, 0, c.width, c.height);
    if (bmp.close) bmp.close();

      if (error) { await state.sb.storage.from(BUCKET).remove([path]); throw error; }

function gantiTema() {

  const gelapSistem = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
  const sekarang = root.getAttribute("data-theme") || (gelapSistem ? "dark" : "light");
  const baru = sekarang === "dark" ? "light" : "dark";
  root.setAttribute("data-theme", baru);
  try { localStorage.setItem("tema", baru); } catch (_) {}
  render();
}
